# ชื่อ workflow ที่แสดงในแท็บ "Actions" บน GitHub
name: Deploy to EC2

# ตัวทริกเกอร์: ให้ทำงานทุกครั้งที่ push โค้ดเข้า branch main
on:
  push:
    branches: [main]

jobs:
  # ชื่อ job (ตั้งอะไรก็ได้) หนึ่ง workflow มีได้หลาย job แต่ที่นี่ใช้แค่ตัวเดียว
  deploy:
    # GitHub จะให้เครื่อง Ubuntu ชั่วคราว (เรียกว่า runner) มารันขั้นตอนด้านล่าง
    runs-on: ubuntu-latest
    steps:
      # ชื่อขั้นตอนที่แสดงใน log ของ Actions
      - name: Pull latest code and rebuild on EC2
        # ส่งค่า secret เข้ามาเป็น environment variable
        # secret ตั้งที่ repo > Settings > Secrets and variables > Actions และจะถูกซ่อนค่าใน log
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        # คำสั่ง shell ที่รันบน runner (ไม่ใช่รันบน EC2)
        run: |
          # สร้างไฟล์ key.pem เปล่าที่เจ้าของอ่าน/เขียนได้คนเดียว (mode 600) ก่อนจะเขียน key ลงไป
          # เพื่อให้ private key ไม่เคยอยู่ในสภาพที่คนอื่นอ่านได้ แม้เพียงชั่วครู่
          install -m 600 /dev/null key.pem
          # เขียน private key จาก secret ลงไฟล์ key.pem (printf '%s\n' ช่วยให้การขึ้นบรรทัดใหม่ครบถ้วน)
          printf '%s\n' "$EC2_SSH_KEY" > key.pem
          # SSH เข้า EC2 แล้วรันคำสั่งในเครื่องหมายคำพูดบนเครื่องนั้น:
          #   -o StrictHostKeyChecking=accept-new  รับ fingerprint ของ server ครั้งแรกโดยไม่ถามยืนยัน (ไม่งั้น workflow จะค้างรอคนตอบ)
          #   -i key.pem                           ล็อกอินด้วยไฟล์กุญแจ แทนการใช้รหัสผ่าน
          #   ec2-user@"$EC2_HOST"                 ผู้ใช้เริ่มต้นของ Amazon Linux @ IP สาธารณะของ EC2
          # คำสั่งในเครื่องหมายคำพูดจะรันบน EC2:
          #   cd ~/test-web-server-aws-ec2         เข้าโฟลเดอร์โค้ดที่ clone ไว้
          #   git pull                             ดึงโค้ดล่าสุดจาก GitHub
          #   HOST_PORT=80 sh build.sh             build image ใหม่และรีสตาร์ท container ที่ port 80
          ssh -o StrictHostKeyChecking=accept-new -i key.pem ec2-user@"$EC2_HOST" \
            'cd ~/test-web-server-aws-ec2 && git pull && HOST_PORT=80 sh build.sh'
